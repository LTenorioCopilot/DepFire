name: Package WebApp Release

# Disparadores del pipeline
on:
  push:
    branches: [ "main" ] # Se ejecuta al hacer push a main
  workflow_dispatch:     # Habilita el botón manual de ejecución
    inputs:
      version_manual:
        description: 'Número de versión a generar (ej. v1.1.0)'
        required: true
        default: 'v1.1.0'

jobs:
  deploy-webapp-files:
    # Se ejecuta en tu servidor local
    runs-on: [ self-hosted, windows ]

    steps:
    - name: 1. Obtener el código fuente de la Web App
      uses: actions/checkout@v4

    - name: 2. Generar versión automática incremental
      id: set_version
      shell: powershell
      run: |
        $inputVersion = "${{ inputs.version_manual }}"
        
        if ($inputVersion) {
            # Si se ejecutó manualmente ingresando una versión, se usa esa
            $version = $inputVersion
            if ($version -notmatch "^v") { $version = "v$version" }
        } else {
            # Si fue por PUSH automático, genera la versión usando el número de ejecución
            # Ejemplo: v1.0.1, v1.0.2, v1.0.3...
            $buildNum = "${{ github.run_number }}"
            $version = "v1.0.$buildNum"
        }
        
        echo "VERSION=$version" >> $env:GITHUB_ENV
        Write-Host ">>> Versión generada para este despliegue: $version <<<" -ForegroundColor Cyan

    - name: 3. Copiar archivos web a la carpeta de Releases
      shell: powershell
      run: |
        $DestinoRelease = "E:\Deploy\DeppFire\Releases\WebApp\${{ env.VERSION }}"
        
        Write-Host "Creando directorio: $DestinoRelease" -ForegroundColor Yellow
        New-Item -ItemType Directory -Path $DestinoRelease -Force | Out-Null
        
        Write-Host "Copiando archivos de la Web App..." -ForegroundColor Yellow
        
        # Copia todo el contenido del repositorio excluyendo la carpeta oculta de Git
        Copy-Item -Path ".*", "*" -Destination $DestinoRelease -Recurse -Force -Exclude ".git"
        
        Write-Host "¡Archivos Web de la versión ${{ env.VERSION }} desplegados en $DestinoRelease!" -ForegroundColor Green
